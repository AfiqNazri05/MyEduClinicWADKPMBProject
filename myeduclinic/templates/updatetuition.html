<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPMB MyEduClinic - Update Tuition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .disabled {
            background-color: #e9e9e9;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 1rem;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #007BFF;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Update Tuition Information</h1>
        </div>

        <form action="{% url 'updatetuitiondata' updateid.tuitioncode %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Enter Tuition Code</label>
                <input type="hidden" name="tuitioncode" value="{{updateid.tuitioncode}}">
                <input type="text" value="{{updateid.tuitioncode}}" disabled class="disabled">
            </div>
            
            <div class="form-group">
                <label>Enter Student ID</label>
                <input type="text" name="tuitionstudentid" value="{{updateid.tuitionstudentid}}" disabled class="disabled">
            </div>
            
            <div class="form-group">
                <label>Enter Mentor ID</label>
                <input type="text" name="tuitionmentorid" value="{{updateid.tuitionmentorid}}" disabled class="disabled">
            </div>

            <div class="form-group">
                <label>Enter Subject Code</label>
                <input type="text" name="subjectcode" value="{{updateid.subjectcode}}" disabled class="disabled">
            </div>

            <div class="form-group">
                <label>Enter New Tuition Meet</label>
                <input type="text" name="tuitionmeet" value="{{updateid.tuitionmeet}}">
            </div>

            <div class="form-group">
                <label>Enter New Tuition Date</label>
                <input type="text" name="tuitiondate" value="{{updateid.tuitiondate}}">
            </div>

            <div class="form-group">
                <label>Enter New Tuition Hour</label>
                <input type="text" name="tuitionduration" value="{{updateid.tuitionduration}}">
            </div>

            <input type="submit" value="UPDATE">
        </form>
    </div>

</body>
</html>
